name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build:api

      - name: Package standalone build
        run: |
          cd apps/api
          rm -rf .next/standalone/apps/api/.next/static
          cp -r .next/static .next/standalone/apps/api/.next/static
          rm -f .next/standalone/apps/api/.env
          cd .next/standalone
          tar -czf ../../deploy.tar.gz apps node_modules package.json

      - name: Upload build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          source: "apps/api/deploy.tar.gz"
          target: "~/"
          strip_components: 2

      - name: Extract and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          script: |
            set -e
            cd ~/domains/eccare.in/public_html
            rm -rf apps/api
            tar -xzf ~/deploy.tar.gz
            mkdir -p apps/api/tmp
            rm -f ~/deploy.tar.gz
            touch apps/api/tmp/restart.txt
            echo "Deploy complete"
