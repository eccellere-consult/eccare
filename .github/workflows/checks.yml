name: PR checks

# Runs on every pull request and every push to a branch, on the same Node.js
# version Hostinger runs (22.x). Red = do NOT merge: the same problem would break
# eccare.in after Hostinger's automatic deploy of main.
#
# It deliberately does NOT run `npm run build` as defined in package.json: that
# script also runs `prisma db push`, which needs a real database. Here we only
# generate the Prisma client, type-check, lint and compile the site, with no
# database touched and no secrets.

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Placeholders only so the code can be compiled. Nothing connects to them.
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci
      JWT_SECRET: ci-placeholder-not-a-secret
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22 (matches Hostinger)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (clean, from the lockfile)
        run: npm ci

      - name: Generate the database client
        run: npx prisma generate

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Compile the site (production build, no database)
        run: npx next build
